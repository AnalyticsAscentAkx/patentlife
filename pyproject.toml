[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patentlife"
version = "0.1.0"
description = "Which patents a company still holds, where, and until when — from public data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
patentlife = "patentlife.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patentlife"]
